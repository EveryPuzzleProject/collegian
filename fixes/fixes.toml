# The Collegian: settings for xword-ocr (docs/fixing.md in xword-ocr).

[ocr]
# The scans are often poor (warped at the page edges, faint rules, parts covered): a puzzle whose
# clues line up for two in five slots is kept, its missing clues marked, for reconstruction on the
# review site, rather than turned down (Alex, 2026-11-06).
keep_partial = 0.4
# The answer keys are small (about 32 px a square) and, from 1979, set on a typewriter: read one
# square at a time, its E comes out B, F P, V Y, M N (run1: 985 of 1,830 wrong squares in 284
# reviewed keys were an E read B). So the key reader also reads each entry as a word, and with gxd's
# answers (reread-letters --gxd-db) decides those letters by their crossing words. On 57 reviewed
# keys: 4.1% of squares wrong before, 1.4% after (xword-ocr docs/collegian-run2.md).
key_entries = true

# The publication's rules (xword-ocr pubrules.py): what holds for these puzzles as a rule, so that
# triage, the ship check, the proof page and the AI reviewer don't ask it of every puzzle. Run1
# (2026-11-07) held 618 of 797 puzzles on "no title found" and 90 AI reviews on that question alone.
[publication]
# No title found is not a question from December 1977 on: under the "Crossword by Mike Shenk"
# banner the daily puzzle prints no title (run1 read a title on 1 of 539 puzzles from then on).
# Before that most puzzles are titled (run1: 96 of 112 in 1976, 74 of 98 from January to August
# 1977), so there a missing title is still asked for: it was probably printed and missed (the
# autumn 1977 layout prints it above the clue lists, where many crops cut it off).
untitled = { note = "from December 1977 the Daily Collegian's crossword prints no title under its Crossword banner", from = "1977-12-01" }
# The puzzles whose answer key was never printed, or isn't in the archive: settled by a person on
# blitz's /answers view (collegian-scans answer_decisions.jsonl, verdict "none"). The file is
# generated by blitz tools/collegian/scan.py publish; edit the source, not the file.
no_key_printed = "no-key-printed.tsv"

# The standing byline. The series is Mike Shenk's crossword for The Daily Collegian, 1976-03-11 to
# 1981-05-15 (README.md; the paper's own notice of 1981-06-10, in exceptions.tsv, names him as its creator), and the
# byline is printed with the "Crossword" banner, often as artwork the OCR doesn't read. Where no
# printed line gives a byline, this is it, shown on the proof page as a publication rule (not as
# typed). A byline read from a printed line always wins.
[[publication.byline]]
value = "by Mike Shenk"
from = "1976-03-11"
to = "1981-05-15"
note = "the series is Mike Shenk's (1976-03-11 to 1981-05-15); the byline is printed with the Crossword banner, often as artwork the OCR doesn't read"

# The pages are the Penn State newspaper archive's page images of The Daily Collegian, described
# in collegian-scans/pages.tsv (xword-ocr docs/sources.md): for each issue a whole page, the
# puzzle crop at native resolution (crop_of), and the answer key's crop with the puzzle it answers
# named in the `answers` column (the pairing was made by a person on blitz's /answers view, so the
# harvest uses it as given and reports any disagreement). An issue is a key like
# collegian-1976-03-11; its leaves are its rows in pages.tsv, in order.
#
# Clues, answers and headers are never typed in here: a value the pipeline can't read goes to the
# exceptions queue with a diagnosis. Decisions that affect how a puzzle is transcribed go in its
# `note`, which reaches the xd and the proof page.
#
# Puzzle fixes are keyed by the puzzle's id (shown on each proof page):
#   [puzzle."collegian1976-03-11-L001"]
#   note = "..."
#
# Page hints are keyed by issue and leaf:
#   [page."collegian-1976-03-11".1]
#   include = true

# The exceptions a person recorded while building the index (collegian/exceptions.tsv).

# 1976-03-22 "Nazism": the black squares form a swastika and the clues are themed on Nazi
# Germany. Alex (2026-11-05): keep the title, and flag the puzzle when it is brought into gxd or
# crossref. The note carries the flag into the xd and onto the proof page.
[puzzle."collegian1976-03-22-L001"]
note = "FLAG ON IMPORT: the grid's black squares form a swastika and the clues are themed on Nazi Germany (33A 'May 7, 1945, for Nazi Germany'). Deliberate theme, intent unknown; title kept as printed. Flag this puzzle when bringing it into gxd or crossref (Alex, 2026-11-05, collegian/exceptions.tsv)."

# 1978-01-20 front page: a reprint of the grid left out of the 1978-01-19 paper, with an apology
# and no clues ("We can't think of anything else you could possibly need"). Its answers are in the
# 1978-01-19 classifieds (pages.tsv names that key for this crop). The harvest keeps the grid as a
# clueless stub (collegian1978-01-20-L003), which Alex wants kept, dated 1978-01-19 at export.
